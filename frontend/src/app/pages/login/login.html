<section class="login-card" aria-labelledby="login-title">
  <h1 id="login-title">Connexion</h1>

  @if (errorMessage()) {
    <p class="form-error" role="alert">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="email" formControlName="email"
        placeholder="Saisissez votre email..."
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid ? 'true' : null" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Saisis une adresse email valide.</small>
      }
    </div>

    <div class="field">
      <label for="login-password">Mot de passe</label>
      <input id="login-password" type="password" autocomplete="current-password"
        formControlName="password" placeholder="Saisissez votre mot de passe..."
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid ? 'true' : null" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Le mot de passe est obligatoire.</small>
      }
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Connexion en cours...' : 'Connexion' }}
      </button>
      <a class="secondary-action" routerLink="/register">Créer un compte</a>
    </div>
  </form>
</section>
