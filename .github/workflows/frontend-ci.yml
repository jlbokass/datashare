name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-build:
    name: Frontend / Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Angular tests with V8 coverage
        run: |
          npm run test:coverage
          printf 'Commit: %s\nUTC: %s\nDriver: V8\nScope: frontend/src/**/*.ts except tests and type declarations\nCommand: npm run test:coverage\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > coverage/datashare/run.txt

      - name: Build Angular production application
        run: npm run build

      - name: Upload Angular coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/datashare/
          if-no-files-found: error
          retention-days: 14
