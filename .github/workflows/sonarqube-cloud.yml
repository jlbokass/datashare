name: SonarQube Cloud

on:
  workflow_run:
    workflows: [Backend CI, Frontend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sonar-main
  cancel-in-progress: false

jobs:
  analysis:
    name: SonarQube / Analysis
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCAN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Locate successful coverage runs for the same main commit
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$SCAN_SHA" != "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" ]]; then
            echo "Superseded main commit; no scan."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for kind in backend frontend; do
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$kind-ci.yml/runs" \
              -f head_sha="$SCAN_SHA" -f branch=main -f event=push -f status=success -F per_page=1 \
              --jq '.workflow_runs[0].id // empty')
            if [[ -z "$run_id" ]]; then
              echo "No successful $kind CI push run for $SCAN_SHA yet."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then exit 1; fi
              exit 0
            fi
            echo "${kind}_run=$run_id" >> "$GITHUB_OUTPUT"
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout the analyzed main revision
        if: steps.reports.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SCAN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download existing coverage artifacts
        if: steps.reports.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RUN: ${{ steps.reports.outputs.backend_run }}
          FRONTEND_RUN: ${{ steps.reports.outputs.frontend_run }}
        run: |
          gh run download "$BACKEND_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "backend-coverage-$SCAN_SHA" --dir backend/coverage
          gh run download "$FRONTEND_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "frontend-coverage-$SCAN_SHA" --dir frontend/coverage/datashare
          test -s backend/coverage/clover.xml
          test -s frontend/coverage/datashare/lcov.info

      - name: Normalize coverage source paths for repository-root analysis
        if: steps.reports.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path.cwd().resolve()

          def source_path(value, component, directory):
              marker = component + "/" + directory + "/"
              path = value.replace("\\", "/")
              if marker in path:
                  relative = marker + path.rsplit(marker, 1)[1]
              elif path.startswith(directory + "/"):
                  relative = component + "/" + path
              else:
                  raise ValueError("Unexpected coverage source path: " + value)
              result = (root / relative).resolve()
              result.relative_to(root / component / directory)
              if not result.is_file():
                  raise ValueError("Coverage source missing: " + relative)
              return str(result)

          clover = root / "backend/coverage/clover.xml"
          tree = ET.parse(clover)
          files = tree.findall(".//file")
          if not files:
              raise ValueError("Empty Clover file list")
          for element in files:
              element.set("name", source_path(element.attrib["name"], "backend", "app"))
          tree.write(clover, encoding="utf-8", xml_declaration=True)

          lcov = root / "frontend/coverage/datashare/lcov.info"
          lines = lcov.read_text().splitlines()
          if not any(line.startswith("SF:") for line in lines):
              raise ValueError("Empty LCOV source list")
          lines = [
              "SF:" + source_path(line[3:], "frontend", "src")
              if line.startswith("SF:") else line for line in lines
          ]
          lcov.write_text("\n".join(lines) + "\n")
          PY

      - name: Analyze PHP and Angular with SonarQube Cloud
        if: steps.reports.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.scm.revision=${{ env.SCAN_SHA }}
