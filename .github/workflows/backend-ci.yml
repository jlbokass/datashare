name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend / Tests and style
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, fileinfo, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata and lockfile
        run: composer validate --no-check-publish

      - name: Install locked PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create ephemeral local application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests (SQLite in-memory)
        run: php artisan test

      - name: Verify Laravel formatting (Pint)
        run: ./vendor/bin/pint --test
