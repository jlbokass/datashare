name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend / Tests and style
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, fileinfo, pdo_sqlite, sqlite3, zip
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer metadata and lockfile
        run: composer validate --no-check-publish

      - name: Install locked PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create ephemeral local application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests with line coverage (SQLite in-memory)
        env:
          PAO_DISABLE: '1'
        run: |
          php artisan test --coverage-clover=coverage/clover.xml --coverage-html=coverage/html --coverage-text=coverage/summary.txt
          cat coverage/summary.txt
          printf 'Commit: %s\nUTC: %s\nDriver: PCOV\nScope: backend/app/**/*.php (including uncovered files)\nCommand: php artisan test --coverage-clover=coverage/clover.xml --coverage-html=coverage/html --coverage-text=coverage/summary.txt\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > coverage/run.txt

      - name: Verify Laravel formatting (Pint)
        run: |
          if ! ./vendor/bin/pint --test; then
            ./vendor/bin/pint
            git diff -- .
            exit 1
          fi

      - name: Upload Laravel coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage/
          if-no-files-found: error
          retention-days: 14
