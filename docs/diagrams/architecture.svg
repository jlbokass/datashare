<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 850" width="1550" height="850" role="img" aria-labelledby="d-title d-desc">
<title id="d-title">DataShare logical architecture, 25 November release</title>
<desc id="d-desc">The registered sender and public recipient interact with an Angular single page application. HTTP requests pass through Nginx to the Laravel API. Laravel uses PostgreSQL, private local storage or isolated Garage S3, and scheduled expiry cleanup. Nginx also proxies the Angular development server.</desc>
<defs>
 <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 3.5 L0 7 Z" fill="#47748a"/></marker>
 <filter id="shadow" x="-20%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#173248" flood-opacity=".10"/></filter>
</defs>
<rect x="0" y="0" width="1550" height="850" fill="#f8fafc"/>
<text x="40" y="66" font-size="31" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#14283c">DataShare — logical architecture</text>
<text x="42" y="111" font-size="17" font-family="Arial,Helvetica,sans-serif" fill="#587185">Release 25 Nov 2026  |  MVP US01–US06 and delivered extensions  |  Local only</text>
<rect x="24" y="140" width="555" height="625" rx="18" fill="#f5f3ff" stroke="#b4a6e0" stroke-width="2" stroke-dasharray="8 7"/><text x="43" y="169" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16" fill="#4f6274">PUBLIC CLIENT / BROWSER</text><rect x="606" y="140" width="914" height="625" rx="18" fill="#effbf9" stroke="#83c9bb" stroke-width="2" stroke-dasharray="8 7"/><text x="625" y="169" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="16" fill="#4f6274">PRIVATE APPLICATION ENVIRONMENT</text><path d="M262 308 L292 308 L292 391 L326 391" fill="none" stroke="#47748a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M262 508 L296 508 L296 440 L326 440" fill="none" stroke="#47748a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M539 414 L640 414" fill="none" stroke="#47748a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M853 414 L935 414" fill="none" stroke="#47748a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1180 375 L1210 375 L1210 291 L1251 291" fill="none" stroke="#47748a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1180 464 L1251 503" fill="none" stroke="#47748a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1060 604 L1060 504" fill="none" stroke="#47748a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="62" y="258" width="200" height="105" rx="15" fill="#ffffff" stroke="#7059b8" stroke-width="2.3" filter="url(#shadow)"/><text x="162" y="290.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Registered sender</text><text x="162" y="316.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Upload and manage files</text><text x="162" y="336.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">US01, US03–US06</text><rect x="62" y="457" width="200" height="105" rx="15" fill="#ffffff" stroke="#7059b8" stroke-width="2.3" filter="url(#shadow)"/><text x="162" y="489.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Link recipient</text><text x="162" y="515.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Public access via token</text><text x="162" y="535.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">US02</text><rect x="326" y="347" width="213" height="137" rx="15" fill="#ffffff" stroke="#7059b8" stroke-width="2.3" filter="url(#shadow)"/><text x="432.5" y="395.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Angular SPA</text><text x="432.5" y="421.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Forms · routing · UX</text><text x="432.5" y="441.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">JWT on protected calls</text><path d="M746.5 347 V300" fill="none" stroke="#47748a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="640" y="218" width="213" height="82" rx="15" fill="#fff" stroke="#008b83" stroke-width="2.3"/><text x="746.5" y="250" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Angular dev server</text><text x="746.5" y="274" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Node / HMR · 4200</text><text x="757" y="326" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#385f72">HTTP</text><rect x="640" y="347" width="213" height="137" rx="15" fill="#ffffff" stroke="#008b83" stroke-width="2.3" filter="url(#shadow)"/><text x="746.5" y="395.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Nginx · Gateway</text><text x="746.5" y="421.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Angular proxy + /api</text><text x="746.5" y="441.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Optional local TLS*</text><rect x="935" y="325" width="245" height="179" rx="15" fill="#ffffff" stroke="#008b83" stroke-width="2.3" filter="url(#shadow)"/><text x="1057.5" y="394.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Laravel REST API</text><text x="1057.5" y="420.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Authentication · validation</text><text x="1057.5" y="440.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Business rules · file access</text><rect x="1251" y="232" width="233" height="110" rx="15" fill="#ffffff" stroke="#c2762f" stroke-width="2.3" filter="url(#shadow)"/><text x="1367.5" y="267" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">PostgreSQL</text><text x="1367.5" y="293" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Users · files metadata</text><text x="1367.5" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Share tokens · expiry</text><rect x="1251" y="448" width="233" height="110" rx="15" fill="#ffffff" stroke="#c2762f" stroke-width="2.3" filter="url(#shadow)"/><text x="1367.5" y="483" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Private file storage</text><text x="1367.5" y="509" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Local disk (default)</text><text x="1367.5" y="529" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">or Garage S3 (isolated)</text><rect x="944" y="604" width="233" height="102" rx="15" fill="#ffffff" stroke="#008b83" stroke-width="2.3" filter="url(#shadow)"/><text x="1060.5" y="635" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#132838">Scheduled cleanup</text><text x="1060.5" y="661" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Daily expiry purge</text><text x="1060.5" y="681" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#566576">Laravel schedule:work</text><text x="271" y="270" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#385f72">upload / account</text><text x="267" y="492" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#385f72">open share link</text><text x="550" y="382" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#385f72">HTTP(S) · /api</text><text x="864" y="382" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#385f72">FastCGI</text><text x="1200" y="291" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#385f72">SQL</text><text x="1197" y="474" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#385f72">I/O</text><text x="1069" y="567" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#385f72">shared Laravel code</text><text x="40" y="811" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#526375">* Local HTTPS optional; public deployment requires HTTPS. Storage is private; Garage uses a separate DB. Scheduler shares Laravel code, not HTTP.</text></svg>