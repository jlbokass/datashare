<svg xmlns="http://www.w3.org/2000/svg" width="1670" height="1060" viewBox="0 0 1670 1060" role="img" aria-labelledby="umlTitle umlDesc"><title id="umlTitle">DataShare conceptual model — UML class diagram</title><desc id="umlDesc">Three conceptual classes: Utilisateur, Transfert and Fichier. Each transfer has exactly one user and each user may have zero or more transfers. Each file belongs to exactly one transfer and each transfer contains one or more files. Optional future download tracing is excluded from this MVP diagram.</desc>
<rect width="1670" height="1060" fill="#fff"/><text x="46" y="72" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32" fill="#153047">DataShare — UML conceptual class model</text><text x="48" y="121" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#65778a">DESIGN-02  •  OpenClassrooms US01–US06  •  Draft v0.2 for review</text><rect x="23" y="170" width="1624" height="509" rx="18" fill="#f2f7fa" stroke="#b9cede" stroke-width="2" stroke-dasharray="8 5"/><text x="48" y="202" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#536a7b">MVP — CONCEPTUAL CLASSES (UML NOTATION)</text>
<path d="M475 443 H630" stroke="#485f71" stroke-width="3" fill="none"/><path d="M1051 443 H1200" stroke="#485f71" stroke-width="3" fill="none"/><path d="M1051 443 L1064 434 L1077 443 L1064 452 Z" fill="#485f71" stroke="#485f71" stroke-width="1.8"/>
<rect x="50" y="254" width="425" height="379" rx="13" fill="#fff" stroke="#5268a8" stroke-width="3"/><path d="M62 254 H463 Q475 254 475 266 V336 H50 V266 Q50 254 62 254" fill="#5268a8"/>
<text x="72" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#fff">UTILISATEUR</text><text x="72" y="316" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff">USER</text>
<text x="69" y="372" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ idUtilisateur: UUID {id}</text>
<text x="69" y="406" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ email: String {unique}</text>
<text x="69" y="440" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">- motDePasseHash: String</text>
<text x="69" y="474" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ dateCreation: DateTime</text>
<text x="69" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ nom: String [0..1]</text>
<text x="69" y="542" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ prenom: String [0..1]</text>
<rect x="630" y="254" width="421" height="379" rx="13" fill="#fff" stroke="#148c85" stroke-width="3"/><path d="M642 254 H1039 Q1051 254 1051 266 V336 H630 V266 Q630 254 642 254" fill="#148c85"/>
<text x="652" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#fff">TRANSFERT</text><text x="652" y="316" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff">TRANSFER</text>
<text x="649" y="372" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ idTransfert: UUID {id}</text>
<text x="649" y="406" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ tokenPartage: String {unique}</text>
<text x="649" y="440" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ dateCreation: DateTime</text>
<text x="649" y="474" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ dateExpiration: DateTime</text>
<text x="649" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ titre: String [0..1]</text>
<text x="649" y="542" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ message: Text [0..1]</text>
<text x="649" y="576" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">/ statut: EtatLien {derived}</text>
<rect x="1200" y="254" width="426" height="379" rx="13" fill="#fff" stroke="#c08939" stroke-width="3"/><path d="M1212 254 H1614 Q1626 254 1626 266 V336 H1200 V266 Q1200 254 1212 254" fill="#c08939"/>
<text x="1222" y="291" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#fff">FICHIER</text><text x="1222" y="316" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#fff">FILE</text>
<text x="1219" y="372" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ idFichier: UUID {id}</text>
<text x="1219" y="406" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ nomOriginal: String</text>
<text x="1219" y="440" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ tailleOctets: Long</text>
<text x="1219" y="474" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ typeMime: String</text>
<text x="1219" y="508" font-family="Arial,Helvetica,sans-serif" font-size="16.5" fill="#1f3850">+ dateEnvoi: DateTime</text>
<text x="492" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#284864">1</text>
<text x="585" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#284864">0..*</text>
<text x="512" y="407" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#284864">crée / creates</text>
<text x="1075" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#284864">1</text>
<text x="1152" y="469" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#284864">1..*</text>
<text x="1060" y="407" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#284864">contient / contains</text>
<rect x="58" y="715" width="1555" height="66" rx="12" fill="#e9f1fa" stroke="#b9cede" stroke-width="1.5"/><text x="836" y="740" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#284662">UML multiplicity is written next to each class: User (1) — (0..*) Transfer  •  Transfer (1) — (1..*) File</text><text x="836" y="761" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#284662">The filled diamond at TRANSFERT denotes composition.</text>
<text x="67" y="831" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40586c">• MVP: each transfer belongs to one registered user, and each file belongs to one transfer.</text>
<text x="67" y="874" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40586c">• US06: deleting a file preserves siblings; deleting the final file removes the empty transfer (proposed).</text>
<text x="67" y="917" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40586c">• Expiry: seven days by default, maximum seven days; link status is computed, not persisted.</text>
<text x="67" y="960" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#40586c">• Optional fields: nom/prenom and titre/message are not mandated by the OpenClassrooms user stories.</text>
</svg>