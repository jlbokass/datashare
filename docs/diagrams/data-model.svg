<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1280" viewBox="0 0 1880 1280" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">DataShare conceptual UML model — MVP and optional extensions</title>
<desc id="diagramDesc">Mandatory entities USER, TRANSFER and FILE. A user has zero or many transfers, each transfer has one owner; a transfer contains one or more files, each file belongs to one transfer. US08 tags are delivered; download events are an unimplemented historical proposal. User has an internal numeric key and a public UUID; files have an optional password hash.</desc>
<rect width="1880" height="1280" fill="#fff"/>
<text x="45" y="67" font-size="33" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#193248">DataShare — Conceptual UML class model</text>
<text x="49" y="121" font-size="17" font-family="Arial,Helvetica,sans-serif" fill="#587085">DESIGN-02 • Release 25 Nov 2026 • Solid: mandatory MVP • Dashed: optional, status indicated</text>
<rect x="25" y="151" width="1825" height="514" rx="15" fill="#f3f7fb" stroke="#a9bfd3" stroke-width="2"/>
<text x="45" y="185" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#4d6476">MVP — US01 to US06 (OpenClassrooms)</text>
<rect x="25" y="711" width="1825" height="475" rx="15" fill="#fff7f8" stroke="#cda4ab" stroke-width="2.1" stroke-dasharray="9 5"/>
<text x="45" y="746" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#855462">OPTIONAL EXTENSIONS — delivered or historical (see labels)</text>
