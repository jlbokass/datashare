<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="980" viewBox="0 0 1580 980" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">DataShare conceptual data model (MCD) — draft v0.1</title><desc id="svgdesc">Three entities, user, transfer and file. Users create zero or many transfers, each transfer is created by exactly one user. Each transfer contains one or many files, and each file belongs to exactly one transfer.</desc>
<defs><filter id="ds" x="-10%" y="-15%" width="125%" height="135%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#27405a" flood-opacity=".09"/></filter></defs>
