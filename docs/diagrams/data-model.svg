<text x="79" y="895" font-size="20" font-weight="700" fill="#7c4c5a" font-family="Arial,Helvetica,sans-serif">Delivery status</text><text x="79" y="939" font-size="15.8" fill="#664f58" font-family="Arial,Helvetica,sans-serif">US07: anonymous upload not implemented.</text><text x="79" y="975" font-size="15.8" fill="#664f58" font-family="Arial,Helvetica,sans-serif">US09: per-file password hash delivered.</text><text x="79" y="1011" font-size="15.8" fill="#664f58" font-family="Arial,Helvetica,sans-serif">US10: daily cleanup delivered under US01.</text><text x="79" y="1047" font-size="15.8" fill="#664f58" font-family="Arial,Helvetica,sans-serif">Download metrics: historical proposal only.</text><text x="79" y="1083" font-size="15.8" fill="#664f58" font-family="Arial,Helvetica,sans-serif">No download-event table is implemented.</text><text x="60" y="1220" font-size="16" font-family="Arial,Helvetica,sans-serif" fill="#7c4c5a">Historical proposal only: a download event would have 1 transfer at creation and 0 or 1 after deletion (nullable FK).</text></svg>