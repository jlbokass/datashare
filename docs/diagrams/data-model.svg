 <rect x="407" y="358" width="40" height="23" rx="5" fill="#f4f8fb" />
 <text x="427" y="376" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1c3f55">0,N</text><path d="M555 395 L599 395" stroke="#466277" stroke-width="2.4"/>
 <rect x="558" y="358" width="40" height="23" rx="5" fill="#f4f8fb" />
 <text x="578" y="376" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1c3f55">1,1</text><path d="M956 395 L1000 395" stroke="#466277" stroke-width="2.4"/>
 <rect x="958" y="358" width="40" height="23" rx="5" fill="#f4f8fb" />
 <text x="978" y="376" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1c3f55">1,N</text><path d="M1103 395 L1150 395" stroke="#466277" stroke-width="2.4"/>
 <rect x="1106" y="358" width="40" height="23" rx="5" fill="#f4f8fb" />
 <text x="1126" y="376" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#1c3f55">1,1</text><rect x="55" y="620" width="1455" height="58" rx="10" fill="#eff5fc" stroke="#b5cbe3" stroke-width="1.5"/>
<text x="74" y="657" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#24445d">Notation: 0,N = none or many; 1,1 = exactly one; 1,N = one or many. Cardinalities describe participation in each association.</text><text x="68" y="724" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#364b61"><tspan font-weight="700">R1</tspan>  MVP: each transfer has exactly one registered owner.</text><text x="68" y="763" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#364b61"><tspan font-weight="700">R2</tspan>  One transfer may hold several files under one share token.</text><text x="68" y="802" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#364b61"><tspan font-weight="700">R3</tspan>  US06 deletes one file; remove transfer when last file goes.</text><text x="68" y="841" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#364b61"><tspan font-weight="700">R4</tspan>  Expiry belongs to transfer (default 7 days, max 7 days).</text><text x="68" y="880" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#364b61"><tspan font-weight="700">R5</tspan>  Link status is derived; bytes stay outside PostgreSQL.</text><text x="55" y="945" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#697b90">DESIGN DECISIONS TO REVIEW: one token per transfer; individual file deletion; delete empty transfer. Physical schema comes later.</text></svg>