<text x="70" y="288" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#fff">UTILISATEUR</text><text x="70" y="313" font-size="12" font-family="Arial,Helvetica,sans-serif" fill="#fff">USER</text><text x="70" y="362" font-size="16.8" font-family="Arial,Helvetica,sans-serif" fill="#173349">+ idUtilisateur: BIGINT {id}</text><text x="70" y="396" font-size="16.8" font-family="Arial,Helvetica,sans-serif" fill="#173349">+ email: String {unique}</text><text x="70" y="430" font-size="16.8" font-family="Arial,Helvetica,sans-serif" fill="#173349">- motDePasseHash: String</text><text x="70" y="464" font-size="16.8" font-family="Arial,Helvetica,sans-serif" fill="#173349">+ dateCreation: DateTime</text><text x="70" y="498" font-size="16.8" font-family="Arial,Helvetica,sans-serif" fill="#173349">+ nom: String [0..1]  (optional)</text><text x="70" y="532" font-size="16.8" font-family="Arial,Helvetica,sans-serif" fill="#173349">+ prenom: String [0..1]  (optional)</text><text x="70" y="566" font-size="16.8" font-family="Arial,Helvetica,sans-serif" fill="#173349">+ public_id: UUID {unique}</text><rect x="685" y="252" width="525" height="348" rx="13" fill="#fff" stroke="#148c85" stroke-width="3"/><path d="M698 252 H1197 Q1210 252 1210 265 V328 H685 V265 Q685 252 698 252" fill="#148c85"/>
