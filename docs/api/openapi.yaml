openapi: 3.1.0
info:
  title: DataShare REST API
  version: 0.1.0
  description: |
    DESIGN-03 — Design contract for the implemented OpenClassrooms MVP (US01–US06),
    reconciled with Laravel on 24 November 2026 (DELIVERY-API #75) and extended
    for release PR #100 (25 November 2026). This YAML contains 11 business
    operations; Scramble generates the local-only runtime specification at
    /docs/api.json, including the two support routes /health and /demo/capabilities.
    Optional US08 adds private file tags; PROFILE-01 adds optional names and profile editing.
    US09 adds optional per-file password protection. US07 and separate US10 extensions are not exposed.
    See README.md for inference limitations.
servers:
  - url: /api
    description: API path prefix on the same origin as the Angular application
tags:
  - name: Authentication
    description: Account registration, JWT authentication and profile editing (US03, US04, PROFILE-01)
  - name: Transfers
    description: Authenticated upload, personal history and individual file deletion and tags (US01, US05, US06, US08)
  - name: Public sharing
    description: Unauthenticated metadata lookup and file download using a share token (US02)
security: []
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      description: |
        Public registration (US03). Email must be unique and valid; password
        must contain at least eight characters. No administrator role and no
        confirmation email are required for this MVP. Optional name (family name)
        and first_name fields may be supplied, each up to 255 characters.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; the user must subsequently log in for a JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and obtain a JWT
      description: Login by registered email and password (US04).
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user's profile
      description: |
        Supporting operation to retrieve the profile using an existing JWT;
        not a separate user story. Refreshing Angular loses its in-memory JWT.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated profile without the password hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthenticationError'

    patch:
      tags: [Authentication]
      summary: Update the authenticated user's name and first name
      description: |
        PROFILE-01. Requires a valid JWT. Only name and first_name are updated.
        Omitted fields remain unchanged; null clears a name. Email, password
        and identifiers are not modifiable through this endpoint.
      operationId: updateCurrentUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /transfers:
    post:
      tags: [Transfers]
      summary: Upload one or more files and create a share link
      description: |
        US01. JWT required. One transfer holds one or more files under one
        unpredictable share token and one expiration date (DESIGN-02 decision).
        A file is limited to 1 GB as specified by OC. For this contract,
        1 GB means 1,000,000,000 bytes (decimal). Maximum five files and
        2,000,000,000 file bytes in total; Nginx/PHP allow multipart overhead.
        Expiration defaults to seven days, and may be set to one through seven
        days. A separate five-minute expiry is opt-in for local/testing only.
        Files are private. Content and extension are checked against pdf, png,
        jpg, jpeg, gif, webp, txt, mp3, mp4 and zip. See SECURITY.md.
        US09: optionally supply passwords[] in file order, including empty entries for unprotected files.
      operationId: createTransfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
            encoding:
              'files[]':
                style: form
                explode: true
              'passwords[]':
                style: form
                explode: true
      responses:
        '201':
          description: Transfer created, files stored and unique share link generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferEnvelope'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Transfers]
      summary: List the current user's uploaded files
      description: |
        US05 and US06, plus optional history pagination (#59). Only owner records
        are returned, 10 transfers per page, newest first (created_at then id).
        The status filter is applied before pagination. Without status, the legacy
        include_expired switch defaults to active transfers only. Purged records
        never appear in history. Files of a transfer are kept together.
      operationId: listMyTransfers
      security:
        - bearerAuth: []
      parameters:
        - name: include_expired
          in: query
          description: |
            Legacy filter used only when status is omitted. False returns active
            transfers; true includes expired transfers awaiting cleanup.
          required: false
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          description: Filter before pagination; takes precedence over include_expired.
          schema:
            type: string
            enum: [active, all, expired]
        - name: page
          in: query
          description: Page number; an out-of-range page returns an empty list and pagination metadata.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
      responses:
        '200':
          description: Transfers and files belonging to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferList'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /transfers/{transferId}/files/{fileId}:
    delete:
      tags: [Transfers]
      summary: Delete one owned file (not the whole transfer)
      description: |
        US06. The Angular UI must explicitly confirm deletion before calling
        this endpoint. The Laravel API verifies ownership through the transfer.
        The file contents and metadata are irreversibly removed. Other files
        in the transfer remain available. If this is the last file, the empty
        transfer and its share token are deleted (DESIGN-02 decision).
        Unknown or non-owned resources return 404 to avoid existence leaks.
      operationId: deleteMyFile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '204':
          description: File and its metadata deleted; no response body
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'

  /transfers/{transferId}/files/{fileId}/tags:
    put:
      tags: [Transfers]
      summary: Replace the private tags of one owned file
      description: |
        US08. Replace the entire list atomically; an empty list clears all tags.
        Labels are trimmed, case-sensitive, non-empty, at most 30 characters,
        and unique per file. Unknown or non-owned resources return 404.
        Tags are not exposed through public sharing.
      operationId: replaceMyFileTags
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileTags'
            example:
              tags: [Projet, Factures]
      responses:
        '200':
          description: Persisted private tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileTags'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /shares/{token}:
    get:
      tags: [Public sharing]
      summary: Read public share metadata
      description: |
        US02. No JWT is required. A valid, unpredictable token is necessary.
        Expose only file metadata needed to decide whether to download:
        filename, type, size, expiry date and password_protected boolean.
        Never disclose the owner, password, password hash, storage path or private object key.
      operationId: getPublicShare
      parameters:
        - $ref: '#/components/parameters/ShareToken'
      responses:
        '200':
          description: Public metadata for a valid, non-expired share
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShareEnvelope'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/ExpiredShareError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /shares/{token}/files/{fileId}:
    get:
      tags: [Public sharing]
      summary: Download an individual file from a valid public share
      description: |
        US02. No JWT required. Validate token, expiry, and that the file
        belongs to the specified transfer before streaming bytes through
        the API. The storage itself must never be publicly accessible.
        An expired but not-yet-purged share responds 410; a purged/unknown
        share or mismatched file responds 404. This route is intentionally
        per-file, consistent with individual deletion in US06. US09 protected files
        additionally require the relative URL signature obtained through POST /authorize.
        A missing, expired or invalid signature returns 403.
      operationId: downloadSharedFile
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/FileId'
        - name: expires
          in: query
          description: Unix expiration timestamp from the signed URL; required only for protected files.
          schema:
            type: integer
        - name: signature
          in: query
          description: Signature from the signed URL; required only for protected files.
          schema:
            type: string
      responses:
        '200':
          description: File bytes streamed as an attachment
          headers:
            Content-Disposition:
              description: Use attachment and a safe original filename
              schema:
                type: string
            X-Content-Type-Options:
              description: Prevent MIME sniffing
              schema:
                type: string
                enum: [nosniff]
            Cache-Control:
              description: Do not cache private transfer content in shared caches
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/ExpiredShareError'
        '403':
          description: Password-protected file without a valid signed URL (password_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/DownloadServerError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /shares/{token}/files/{fileId}/authorize:
    post:
      tags: [Public sharing]
      summary: Authorize a password-protected download
      description: |
        US09. No JWT. Verify share token, file membership, expiry and password.
        Return a relative signed URL valid for 60 seconds for the selected file only.
        Five attempts per minute per client IP; no password or hash in the response.
        Use the returned URL as-is, before expiry.
      operationId: authorizeProtectedDownload
      parameters:
        - $ref: '#/components/parameters/ShareToken'
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 6
                  maxLength: 72
                  description: Exact password, at most 72 UTF-8 bytes; not blank or NUL-containing.
      responses:
        '200':
          description: Temporary signed download URL (relative to the application origin)
          content:
            application/json:
              schema:
                type: object
                required: [download_url]
                properties:
                  download_url:
                    type: string
        '403':
          description: Incorrect password or file not protected (invalid_password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '410':
          $ref: '#/components/responses/ExpiredShareError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by POST /auth/login and sent as Authorization: Bearer <token>.
        Public share operations do not require authentication.
  parameters:
    TransferId:
      name: transferId
      in: path
      required: true
      description: Internal transfer identifier
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      description: Internal file identifier; must belong to the selected transfer
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      description: Unpredictable share token; different from the login JWT
      schema:
        type: string
        minLength: 64
        maxLength: 64
        pattern: '^[a-f0-9]{64}$'
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, first_name, created_at]
      properties:
        id:
          type: [string, "null"]
          format: uuid
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
          maxLength: 255
          description: Optional family name; null if not supplied.
        first_name:
          type: [string, "null"]
          maxLength: 255
          description: Optional given name; null if not supplied.
        created_at:
          type: [string, "null"]
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          writeOnly: true
        name:
          type: [string, "null"]
          maxLength: 255
          description: Optional family name; null if not supplied.
        first_name:
          type: [string, "null"]
          maxLength: 255
          description: Optional given name; null if not supplied.
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          maxLength: 255
          description: Optional family name; null if not supplied.
        first_name:
          type: [string, "null"]
          maxLength: 255
          description: Optional given name; null if not supplied.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          writeOnly: true
    UserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
          description: Signed JSON Web Token (never a share token)
        token_type:
          type: string
          const: Bearer
        user:
          $ref: '#/components/schemas/User'
    FileMetadata:
      type: object
      additionalProperties: false
      required: [id, original_name, size_bytes, mime_type, uploaded_at, password_protected]
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        mime_type:
          type: string
        uploaded_at:
          type: string
          format: date-time
        password_protected:
          type: boolean
    OwnedFileMetadata:
      type: object
      additionalProperties: false
      required: [id, original_name, size_bytes, mime_type, uploaded_at, tags, password_protected]
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        mime_type:
          type: string
        uploaded_at:
          type: string
          format: date-time
        tags:
          $ref: '#/components/schemas/TagList'
        password_protected:
          type: boolean
    TagList:
      type: array
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 30
      description: Private labels, trimmed and unique per file; exact case is retained.
    FileTags:
      type: object
      additionalProperties: false
      required: [tags]
      properties:
        tags:
          $ref: '#/components/schemas/TagList'
    Transfer:
      type: object
      additionalProperties: false
      required: [id, share_url, created_at, expires_at, status, files]
      properties:
        id:
          type: string
          format: uuid
        share_url:
          type: string
          description: Relative Angular URL in the form /share/{token}
          example: /share/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [valid, expired]
          description: Derived from the expiration instant; not persisted
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OwnedFileMetadata'
    PublicShare:
      type: object
      additionalProperties: false
      required: [expires_at, files]
      properties:
        expires_at:
          type: string
          format: date-time
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FileMetadata'
    CreateTransferRequest:
      type: object
      required: ['files[]']
      not:
        required: [expires_in_days, expires_in_minutes]
      properties:
        'files[]':
          type: array
          minItems: 1
          maxItems: 5
          description: |
            Repeated files[] multipart parts: 1–5 files, each at most
            1,000,000,000 bytes, at most 2,000,000,000 bytes in total.
            Content and extension must match the allowlist in SECURITY.md.
          items:
            type: string
            format: binary
        'passwords[]':
          type: array
          description: |
            Optional repeated multipart text parts, exactly one per file in the same order.
            Empty string means unprotected. Otherwise 6 characters minimum, 72 UTF-8 bytes
            maximum, no NUL or whitespace-only value. Leading/trailing spaces are significant.
          maxItems: 5
          items:
            anyOf:
              - type: string
                const: ''
              - type: string
                format: password
                minLength: 6
                maxLength: 72
                writeOnly: true
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 7
          default: 7
          description: Default 7 when neither expiry field is supplied; excludes expires_in_minutes
        expires_in_minutes:
          type: integer
          enum: [5]
          description: Only local/testing with TRANSFER_DEMO_5_MIN_ENABLED=true, otherwise 422; excludes expires_in_days
    TransferEnvelope:
      type: object
      additionalProperties: false
      required: [transfer]
      properties:
        transfer:
          $ref: '#/components/schemas/Transfer'
    TransferList:
      type: object
      additionalProperties: false
      required: [transfers, pagination]
      properties:
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
        pagination:
          type: object
          required: [current_page, per_page, last_page, total]
          properties:
            current_page:
              type: integer
              minimum: 1
            per_page:
              type: integer
              const: 10
            last_page:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 0
    PublicShareEnvelope:
      type: object
      additionalProperties: false
      required: [share]
      properties:
        share:
          $ref: '#/components/schemas/PublicShare'
    ApiError:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message:
          type: string
          description: Human-readable message suitable for display to the user
        code:
          type: string
          description: Stable machine-readable error identifier
        errors:
          type: object
          description: Optional field-level validation details
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    AuthenticationError:
      description: Missing/invalid JWT, or wrong login credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Authentication failed.
            code: unauthenticated
    ValidationError:
      description: Validation error (including unsupported file type or invalid expiry)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: The provided data is invalid.
            code: validation_error
            errors:
              expires_in_days: [The expiry must be between 1 and 7 days.]
    PayloadTooLargeError:
      description: Per-file, total file-byte or proxy request-size limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: File is too large.
            code: payload_too_large
    NotFoundError:
      description: Resource not found, or not visible to the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Resource not found.
            code: not_found
    ExpiredShareError:
      description: Share expired but has not yet been purged
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: This share link has expired.
            code: share_expired
    ServerError:
      description: Server/storage failure; no sensitive implementation details exposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Unable to complete the operation.
            code: server_error
    TooManyRequestsError:
      description: Rate limit exceeded (register 10/min, login 5/min, public share reads/downloads 60/min, password authorization 5/min per IP)
      headers:
        Retry-After:
          description: Seconds until retry is permitted
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
    DownloadServerError:
      description: |
        Unhandled storage failure before streaming starts; framework JSON error
        without a guaranteed code field. APP_DEBUG may add diagnostics locally.
        A failure after headers have been sent may truncate the download instead.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
