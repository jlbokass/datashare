# DataShare P3 — local-only, Docker-first development stack.
# Browser -> Nginx:8080 -> Angular dev server OR Laravel PHP-FPM.
name: datashare-p3

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot scaffolding/Composer tools (not running by default).
  php:
    profiles: ["tools"]
    build:
      context: ./docker/php
    working_dir: /workspace
    volumes:
      - ./:/workspace

  node:
    profiles: ["tools"]
    image: node:24-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
      # Reuse dependencies installed by the frontend service on a fresh clone.
      # scripts/qa.sh runs Angular tests/build from this CLI service.
      - frontend_node_modules:/workspace/frontend/node_modules

  app:
    build:
      context: ./docker/php
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    environment:
      # Send Laravel events as JSON to the container's stderr.
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: 'Monolog\Formatter\JsonFormatter'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    depends_on:
      db:
        condition: service_healthy

  # Processes the daily expiration purge without host cron or public ports.
  scheduler:
    build:
      context: ./docker/php
    working_dir: /workspace/backend
    volumes:
      - ./backend:/workspace/backend
    environment:
      # Send Laravel events as JSON to the container's stderr.
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: 'Monolog\Formatter\JsonFormatter'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-bookworm-slim
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      # Keep container-specific npm dependencies out of the host bind mount.
      - frontend_node_modules:/workspace/frontend/node_modules
    command:
      - sh
      - -lc
      - >
        if [ ! -x node_modules/.bin/ng ]; then npm ci; fi;
        npm run start -- --host 0.0.0.0 --port 4200 --poll 1000

  web:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend

volumes:
  postgres_data:
  frontend_node_modules:
