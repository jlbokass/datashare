# SonarQube Cloud project identity is supplied by GitHub Actions repository variables.
sonar.projectName=DataShare
sonar.sourceEncoding=UTF-8

# Match the application-code scope of the existing coverage reports.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.php,frontend/src/**/*.spec.ts
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/**/*.d.ts

sonar.php.coverage.reportPaths=backend/coverage/clover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/datashare/lcov.info

# Informational analysis: do not wait for or enforce the Quality Gate.
sonar.qualitygate.wait=false
