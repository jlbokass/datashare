# Optional local database explorer; independent from the application stacks.
name: datashare-pgadmin

services:
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    env_file: .env.pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - app
      - garage
      - test

# Separate access networks. Database containers join on demand, without
# changing the normal Compose stacks or publishing PostgreSQL ports.
networks:
  app:
    name: datashare-pgadmin-app
  garage:
    name: datashare-pgadmin-garage
  test:
    name: datashare-pgadmin-test

volumes:
  pgadmin_data:
