# DataShare development-only gateway: one browser origin for Angular and Laravel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10m; # US01 upload limits will be configured separately.

    # Laravel API, no direct access to PHP files through the web server.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    # Framework-provided application health endpoint.
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }

    # Angular CLI + HMR WebSocket upgrades.
    location / {
        proxy_pass http://frontend:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
