# DataShare development-only gateway: one browser origin for Angular and Laravel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Record metrics without request URLs, headers or share tokens.
log_format datashare_json escape=json
    '{"timestamp":"$time_iso8601","method":"$request_method",'
    '"status":$status,"request_time_s":$request_time,'
    '"request_bytes":$request_length,"response_body_bytes":$body_bytes_sent}';

server {
    listen 80;
    access_log /dev/stdout datashare_json;
    server_name localhost;
    # Max total 2 GB decimal, with room for multipart overhead.
    client_max_body_size 2200m;

    # Laravel API, no direct access to PHP files through the web server.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 600s;
        error_page 413 = @api_payload_too_large;
    }

    location @api_payload_too_large {
        default_type application/json;
        return 413 '{"message":"Le transfert dépasse la limite autorisée.","code":"payload_too_large"}';
    }

    # Scramble documentation; Laravel retains the local-environment access check.
    location = /docs/api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }

    location = /docs/api.json {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }

    # Framework-provided application health endpoint.
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /workspace/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }

    # Angular CLI + HMR WebSocket upgrades.
    location / {
        proxy_pass http://frontend:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
