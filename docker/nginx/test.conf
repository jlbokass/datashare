# HTTP gateway for the isolated Compose test stack.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Record metrics without request URLs, headers or share tokens.
log_format datashare_json escape=json
    '{"timestamp":"$time_iso8601","method":"$request_method",'
    '"status":$status,"request_time_s":$request_time,'
    '"request_bytes":$request_length,"response_body_bytes":$body_bytes_sent}';

server {
    listen 80;
    access_log /dev/stdout datashare_json;
    server_name web;
    # Keep the isolated test gateway consistent with the development upload cap.
    client_max_body_size 2200m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    location ^~ /api/ {
        proxy_pass http://app:8000;
    }

    location = /up {
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://frontend:4200;
        # Vite accepts localhost without changing Angular's allowed hosts.
        proxy_set_header Host localhost:4200;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
