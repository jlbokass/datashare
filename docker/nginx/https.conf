# Included in the existing server only when local TLS is enabled.
listen 443 ssl;
ssl_certificate /etc/nginx/certs/datashare.pem;
ssl_certificate_key /etc/nginx/certs/datashare-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;

# Preserve method and path while moving to the fixed local HTTPS origin.
if ($scheme = http) {
    return 308 https://127.0.0.1:8443$request_uri;
}
